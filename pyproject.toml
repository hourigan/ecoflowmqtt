[project]
name = "ecoflow-mqtt"
version = "0.1.0"
description = "Poll EcoFlow Open Platform devices and publish readings to a local MQTT broker."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "paho-mqtt>=2.1.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ecoflow-mqtt = "ecoflow_mqtt.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
